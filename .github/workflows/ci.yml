name: CI/CD - DevOps Assignment Lab

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      confirm_deploy:
        description: "Type 'deploy' to actually apply infrastructure changes (otherwise this run only validates/scans/tests)"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  terraform-validate:
    name: Terraform fmt & validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.14.7"

      - name: terraform fmt (check only, no changes)
        working-directory: terraform
        run: terraform fmt -check -recursive

      - name: terraform init (no backend - syntax/logic check only)
        working-directory: terraform
        run: terraform init -backend=false

      - name: terraform validate
        working-directory: terraform
        run: terraform validate

  trivy-iac-scan:
    name: Trivy IaC misconfiguration scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run Trivy config scan on Terraform
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: "config"
          scan-ref: "terraform"
          exit-code: "1"
          severity: "CRITICAL,HIGH"

      - name: Run Trivy filesystem scan (scripts + deps)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: "fs"
          scan-ref: "."
          exit-code: "1"
          severity: "CRITICAL,HIGH"
          skip-dirs: ".git"

  gitleaks-secret-scan:
    name: Gitleaks secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install and run Gitleaks
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz -o gitleaks.tar.gz
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks detect --source . --no-git --redact --exit-code 1 --report-format json --report-path gitleaks-report.json

      - name: Upload Gitleaks report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-report
          path: gitleaks-report.json

  verifier-unit-tests:
    name: Verifier unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run verifier unit tests
        working-directory: scripts
        run: python3 -m unittest test_verify.py -v

  # Deployment is gated on ALL of the above passing (Terraform validity, IaC
  # security scan, secret scan, and verifier logic tests), plus a controlled
  # manual trigger (workflow_dispatch with an explicit confirm string) - this
  # is not run on ordinary pushes/PRs. Configure a required-reviewers rule on
  # the "production" GitHub Environment for an extra approval gate on top of
  # this.
  deploy:
    name: Deploy lab (gated, manual trigger only)
    runs-on: ubuntu-latest
    needs: [terraform-validate, trivy-iac-scan, gitleaks-secret-scan, verifier-unit-tests]
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.confirm_deploy == 'deploy'
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.14.7"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1

      - name: Write SSH keypair from protected secrets
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/devops-assignment
          printf '%s\n' "${{ secrets.SSH_PUBLIC_KEY }}" > ~/.ssh/devops-assignment.pub
          chmod 600 ~/.ssh/devops-assignment
          chmod 644 ~/.ssh/devops-assignment.pub

      - name: Terraform init
        working-directory: terraform
        run: terraform init

      - name: Terraform apply (includes the verifier gate via null_resource)
        working-directory: terraform
        run: |
          terraform apply -auto-approve \
            -var="allowed_ip=${{ secrets.ALLOWED_IP }}" \
            -var="public_key_path=${HOME}/.ssh/devops-assignment.pub" \
            -var="ssh_private_key_path=${HOME}/.ssh/devops-assignment"
